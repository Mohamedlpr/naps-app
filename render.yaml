services:
  - type: web
    name: naps-api
    runtime: node
    plan: free
    rootDir: naps_api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
